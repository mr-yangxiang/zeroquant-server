name: ZeroQuant Build and Contract Tests

on:
  push:
    branches: [ "auto", "main", "master" ]
  pull_request:
    branches: [ "auto", "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Install server dependencies
      run: npm ci

    - name: Build server project
      run: npm run build

    - name: Test domains, authentication, and isolated migrations
      run: |
        npm run test:domains
        npm run test:migrations

    - name: Check database catalog and production guards
      run: |
        npm run schema:catalog-check
        node --import tsx test/research-production.test.ts

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install isolated Python API test dependencies
      run: python -m pip install -r quant_engine/requirements-service-test.txt

    - name: Test layered Python API and database contracts
      env:
        PYTHONPATH: quant_engine
        PYTHONDONTWRITEBYTECODE: '1'
      run: python -m unittest discover -s quant_engine/service_tests -v

    # This workflow validates code only. Production deployment is separately approved.
